version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/bracket.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: bracket-backend
build:
  run_buildscript: false
images:
  - id: bracket-backend
    target: service
    service: bracket-backend
    source: ghcr.io/evroon/bracket-backend
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
  - id: bracket-frontend
    target: service
    service: bracket-frontend
    source: ghcr.io/evroon/bracket-frontend
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
  - id: postgres
    target: service
    service: postgres
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^16\.\d+-alpine$'
    version_regex: '^(?P<version>16\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Bracket
    summary: "自托管赛事系统"
